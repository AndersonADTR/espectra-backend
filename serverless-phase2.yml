service: espectra-backend-phase2-v4r1

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  memorySize: 1024
  timeout: 29
  logRetentionInDays: 14
  tracing:
    lambda: true
  tags:
    Project: espectra-backend
    Environment: dev
    Component: Storage
    Purpose: Infrastructure
    ManagedBy: serverless
    Company: technoapes
    Owner: espectra

custom:
  projectName: espectra-backend
  stage: dev
  deploymentId: v4-r1
  resourcePrefix: espectra-backend-dev-v4-r1
  service: espectra-backend
  company: technoapes
  floor: 1
  logRetentionInDays: 14

  # Configuración de Table Names
  tableNames:
    connections: espectra-backend-dev-v4-r1-connection-table
    context: espectra-backend-dev-v4-r1-conversation-context-table
    tokens: espectra-backend-dev-v4-r1-token-usage-table
    handoff: espectra-backend-dev-v4-r1-handoff-table
    metrics: espectra-backend-dev-v4-r1-botpress-metrics-table

  # KMS Keys (importados del deploy previo)
  kms:
    systemKeyId: ${ssm:/espectra/dev/kms/system-key-id, 'espectra-backend-dev-v4-r1-kms-SystemKeyId'}
    systemKeyArn: ${ssm:/espectra/dev/kms/system-key-arn, 'espectra-backend-dev-v4-r1-kms-SystemKeyArn'}
    secretsKeyId: ${ssm:/espectra/dev/kms/secrets-key-id, 'espectra-backend-dev-v4-r1-kms-SecretsKeyId'}
    secretsKeyArn: ${ssm:/espectra/dev/kms/secrets-key-arn, 'espectra-backend-dev-v4-r1-kms-SecretsKeyArn'}
    websocketKeyId: ${ssm:/espectra/dev/kms/websocket-key-id, 'espectra-backend-dev-v4-r1-kms-WebsocketKeyId'}
    websocketKeyArn: ${ssm:/espectra/dev/kms/websocket-key-arn, 'espectra-backend-dev-v4-r1-kms-WebsocketKeyArn'}

  # SNS Topics for different priority levels
  snsHighPriorityTopic: ${ssm:/espectra/dev/sns/high-priority-topic, 'espectra-backend-dev-v4-r1-sns-HighPriorityTopicArn'}
  snsMediumPriorityTopic: ${ssm:/espectra/dev/sns/medium-priority-topic, 'espectra-backend-dev-v4-r1-sns-MediumPriorityTopicArn'}
  snsLowPriorityTopic: ${ssm:/espectra/dev/sns/low-priority-topic, 'espectra-backend-dev-v4-r1-sns-LowPriorityTopicArn'}

  # Configuración de handoff
  handoff:
    maxQueueSize: 100
    maxWaitTime: 300

  redis:
    instanceType: 'cache.t3.micro'

functions:
  botpressMetricsCollector:
    handler: services/metrics/handlers/metrics-collector.handler
    name: ${self:custom.resourcePrefix}-botpress-metrics
    description: Processes Botpress metrics events
    memorySize: 256
    timeout: 30
    environment:
      METRICS_TABLE:
        Ref: BotpressMetricsTable
      KMS_KEY_ARN:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
    role:
      Fn::GetAtt: [MetricsCollectorRole, Arn]
    events:
      - eventBridge:
          pattern:
            source:
              - com.espectra.botpress
            detail-type:
              - Metric
    tags:
      Service: espectra-backend
      Environment: dev
      Component: Metrics
      ManagedBy: serverless
      Company: technoapes
    tracing: Active
    vpc:
      securityGroupIds:
        - Fn::ImportValue: ${self:custom.resourcePrefix}-phase1-LambdaSecurityGroupId
      subnetIds:
        - Fn::ImportValue: ${self:custom.resourcePrefix}-phase1-PublicSubnet1Id
        - Fn::ImportValue: ${self:custom.resourcePrefix}-phase1-PublicSubnet2Id

resources:
  - ${file(infrastructure/dynamodb/botpress-tables.yml)}

  - ${file(infrastructure/queues/message-queues.yml)}

  - ${file(infrastructure/elasticache/redis.yml)}

  - ${file(infrastructure/eventbridge/botpress-event-bus.yml)}

  - ${file(infrastructure/iam/roles.yml)}
  - ${file(infrastructure/iam/websocket-roles.yml)}