service: espectra-backend-phase2-v4r1

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  memorySize: 1024
  timeout: 29
  logRetentionInDays: 14
  tracing:
    lambda: true
  tags:
    Project: espectra-backend
    Environment: dev
    Component: Storage
    Purpose: Infrastructure
    ManagedBy: serverless
    Company: technoapes
    Owner: espectra

custom:
  projectName: espectra-backend
  stage: dev
  deploymentId: v4-r1
  resourcePrefix: espectra-backend-dev-v4-r1
  service: espectra-backend
  company: technoapes
  floor: 1
  logRetentionInDays: 14

  # Configuración de Table Names
  tableNames:
    connections: espectra-backend-dev-v4-r1-connection-table
    context: espectra-backend-dev-v4-r1-conversation-context-table
    tokens: espectra-backend-dev-v4-r1-token-usage-table
    handoff: espectra-backend-dev-v4-r1-handoff-table
    metrics: espectra-backend-dev-v4-r1-botpress-metrics-table

  # KMS Keys (importados del deploy previo)
  kms:
    systemKeyId: ${ssm:/espectra/dev/kms/system-key-id, 'espectra-backend-dev-v4-r1-kms-SystemKeyId'}
    systemKeyArn: ${ssm:/espectra/dev/kms/system-key-arn, 'espectra-backend-dev-v4-r1-kms-SystemKeyArn'}
    secretsKeyId: ${ssm:/espectra/dev/kms/secrets-key-id, 'espectra-backend-dev-v4-r1-kms-SecretsKeyId'}
    secretsKeyArn: ${ssm:/espectra/dev/kms/secrets-key-arn, 'espectra-backend-dev-v4-r1-kms-SecretsKeyArn'}
    websocketKeyId: ${ssm:/espectra/dev/kms/websocket-key-id, 'espectra-backend-dev-v4-r1-kms-WebsocketKeyId'}
    websocketKeyArn: ${ssm:/espectra/dev/kms/websocket-key-arn, 'espectra-backend-dev-v4-r1-kms-WebsocketKeyArn'}

  # SNS Topics for different priority levels
  snsHighPriorityTopic: ${ssm:/espectra/dev/sns/high-priority-topic, 'espectra-backend-dev-v4-r1-sns-HighPriorityTopicArn'}
  snsMediumPriorityTopic: ${ssm:/espectra/dev/sns/medium-priority-topic, 'espectra-backend-dev-v4-r1-sns-MediumPriorityTopicArn'}
  snsLowPriorityTopic: ${ssm:/espectra/dev/sns/low-priority-topic, 'espectra-backend-dev-v4-r1-sns-LowPriorityTopicArn'}

  # Configuración de handoff
  handoff:
    maxQueueSize: 100
    maxWaitTime: 300

  redis:
    instanceType: 'cache.t3.micro'

functions:
  botpressMetricsCollector:
    handler: services/metrics/handlers/metrics-collector.handler
    name: espectra-backend-dev-v4-r1-botpress-metrics
    description: Processes Botpress metrics events
    memorySize: 256
    timeout: 30
    environment:
      METRICS_TABLE:
        Ref: BotpressMetricsTable
      KMS_KEY_ARN:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
    role:
      Fn::GetAtt: [MetricsCollectorRole, Arn]
    events:
      - eventBridge:
          pattern:
            source:
              - com.espectra.botpress
            detail-type:
              - Metric
    tags:
      Service: espectra-backend
      Environment: dev
      Component: Metrics
      ManagedBy: serverless
      Company: technoapes
    tracing: Active
    vpc:
      securityGroupIds:
        - Fn::ImportValue: espectra-backend-dev-v4-r1-phase1-LambdaSecurityGroupId
      subnetIds:
        - Fn::ImportValue: espectra-backend-dev-v4-r1-phase1-PublicSubnet1Id
        - Fn::ImportValue: espectra-backend-dev-v4-r1-phase1-PublicSubnet2Id

resources:
  - ${file(infrastructure/dynamodb/botpress-tables.yml)}

  - ${file(infrastructure/queues/message-queues.yml)}

  - ${file(infrastructure/elasticache/redis.yml)}

  - ${file(infrastructure/eventbridge/botpress-event-bus.yml)}

  - ${file(infrastructure/iam/roles.yml)}
  - ${file(infrastructure/iam/websocket-roles.yml)}

outputs:
  BotpressMetricsCollectorArn:
    Description: ARN of the Botpress Metrics Collector function
    Value:
      Fn::GetAtt: [BotpressMetricsCollectorLambdaFunction, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-metrics-collector-arn

  MessageQueueUrl:
    Description: URL of the message queue
    Value:
      Ref: MessageQueue
    Export:
      Name: espectra-backend-dev-v4-r1-message-queue-url

  MessageQueueArn:
    Description: ARN of the message queue
    Value:
      Fn::GetAtt: [MessageQueue, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-message-queue-arn

  HandoffQueueUrl:
    Description: URL of the handoff queue
    Value:
      Ref: HandoffQueue
    Export:
      Name: espectra-backend-dev-v4-r1-handoff-queue-url

  HandoffQueueArn:
    Description: ARN of the handoff queue
    Value:
      Fn::GetAtt: [HandoffQueue, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-handoff-queue-arn

  MessageDLQUrl:
    Description: URL of the message DLQ
    Value:
      Ref: MessageDLQ
    Export:
      Name: espectra-backend-dev-v4-r1-message-dlq-url

  HandoffDLQUrl:
    Description: URL of the handoff DLQ
    Value:
      Ref: HandoffDLQ
    Export:
      Name: espectra-backend-dev-v4-r1-handoff-dlq-url

  LambdaRoleArn:
    Description: ARN of the Lambda execution IAM role
    Value:
      Fn::GetAtt: [IamRoleLambdaExecution, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-lambda-role-arn

  WafAssociationLambdaRoleArn:
    Description: ARN of the WAF Association Lambda IAM role
    Value:
      Fn::GetAtt: [WafAssociationLambdaRole, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-waf-association-lambda-role-arn

  MetricsCollectorRoleArn:
    Description: ARN of the Metrics Collector IAM role
    Value:
      Fn::GetAtt: [MetricsCollectorRole, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-metrics-collector-role-arn

  WebSocketLambdaRoleArn:
    Description: ARN of the WebSocket Lambda IAM role
    Value:
      Fn::GetAtt: [WebSocketLambdaRole, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-websocket-role-arn

  WebSocketAuthorizerRoleArn:
    Description: ARN of the WebSocket Authorizer Lambda IAM role
    Value:
      Fn::GetAtt: [WebSocketAuthorizerRole, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-websocket-authorizer-role-arn

  EventBusArn:
    Description: ARN of the Botpress Event Bus
    Value:
      Fn::GetAtt: [BotpressEventBus, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-eventbus-arn

  EventBusName:
    Description: Name of the Botpress Event Bus
    Value:
      Ref: BotpressEventBus
    Export:
      Name: espectra-backend-dev-v4-r1-eventbus-name

  RedisEndpoint:
    Description: Redis primary endpoint
    Value:
      Fn::GetAtt: [RedisCluster, PrimaryEndPoint.Address]
    Export:
      Name: espectra-backend-dev-v4-r1-redis-endpoint

  RedisPort:
    Description: Redis port
    Value:
      Fn::GetAtt: [RedisCluster, PrimaryEndPoint.Port]
    Export:
      Name: espectra-backend-dev-v4-r1-redis-port

  RedisConnectionString:
    Description: Redis connection string with protocol
    Value:
      Fn::Sub: "redis://${RedisCluster.PrimaryEndPoint.Address}:${RedisCluster.PrimaryEndPoint.Port}"
    Export:
      Name: espectra-backend-dev-v4-r1-redis-connection-string

  RedisClusterId:
    Description: ID of the Redis cluster
    Value:
      Ref: RedisCluster
    Export:
      Name: espectra-backend-dev-v4-r1-redis-cluster-id

  RedisParameterGroupName:
    Description: Name of the Redis parameter group
    Value:
      Ref: RedisParameterGroup
    Export:
      Name: espectra-backend-dev-v4-r1-redis-parameter-group

  ConversationContextTableName:
    Description: Name of the Conversation Context table
    Value: ${self:custom.tableNames.context}
    Export:
      Name: espectra-backend-dev-v4-r1-context-table-name

  ConversationContextTableArn:
    Description: ARN of the Conversation Context table
    Value:
      Fn::GetAtt: [ConversationContextTable, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-context-table-arn

  BotpressMetricsTableName:
    Description: Name of the Botpress Metrics table
    Value: ${self:custom.tableNames.metrics}
    Export:
      Name: espectra-backend-dev-v4-r1-metrics-table-name

  BotpressMetricsTableArn:
    Description: ARN of the Botpress Metrics table
    Value:
      Fn::GetAtt: [BotpressMetricsTable, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-metrics-table-arn

  TokenUsageTableName:
    Description: Name of the Token Usage table
    Value: ${self:custom.tableNames.tokens}
    Export:
      Name: espectra-backend-dev-v4-r1-tokens-table-name

  TokenUsageTableArn:
    Description: ARN of the Token Usage table
    Value:
      Fn::GetAtt: [TokenUsageTable, Arn]
    Export:
      Name: espectra-backend-dev-v4-r1-tokens-table-arn