service: espectra-backend-phase5-v4r1

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  memorySize: 1024
  timeout: 29
  logRetentionInDays: 14
  tracing:
    lambda: false
  # Disabled logs configuration to avoid CloudWatch Logs role requirement
  # logs:
  #   restApi:
  #     accessLogging: false
  #     executionLogging: false
  #     level: OFF
  #     fullExecutionData: false
  vpc:
    securityGroupIds:
      - Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-security-group-id
    subnetIds:
      - Fn::ImportValue: ${self:custom.resourcePrefix}-public-subnet-1-id
      - Fn::ImportValue: ${self:custom.resourcePrefix}-public-subnet-2-id
  environment:
    # System Variables
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    SERVICE_NAME: ${self:custom.service}
    NODE_ENV: ${self:provider.stage}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}}
    METRICS_NAMESPACE: ${self:custom.service}/${self:provider.stage}
    XRAY_ENABLED: true

    # Referencias a recursos existentes
    BOTPRESS_API_URL: ${ssm:/espectra/${self:provider.stage}/botpress-api-url}
    BOTPRESS_BOT_ID: ${ssm:/espectra/${self:provider.stage}/botpress-bot-id}
    BOTPRESS_API_KEY: ${ssm:/espectra/${self:provider.stage}/botpress-api-key}
    BOTPRESS_WORKSPACE_ID: ${ssm:/espectra/${self:provider.stage}/botpress-workspace-id}
    BOTPRESS_EVENT_BUS:
      Fn::ImportValue: ${self:custom.resourcePrefix}-eventbus-name

custom:
  service: espectra-backend
  resourcePrefix: espectra-backend-dev-v4-r1
  logRetentionInDays: 14

  redis:
    instanceType: 'cache.t3.micro'

  logLevel:
    dev: 'DEBUG'
    staging: 'INFO'
    prod: 'WARN'

  # Configuración de Table Names
  tableNames:
    connections: ${self:custom.resourcePrefix}-connection-table
    context: ${self:custom.resourcePrefix}-conversation-context-table
    tokens: ${self:custom.resourcePrefix}-token-usage-table
    handoff: ${self:custom.resourcePrefix}-handoff-table
    metrics: ${self:custom.resourcePrefix}-botpress-metrics-table

  # KMS Keys (importados del deploy previo)
  kms:
    systemKeyId:
      Fn::ImportValue: espectra-backend-dev-v4-r1-kms-SystemKeyId
    systemKeyArn:
      Fn::ImportValue: espectra-backend-dev-v4-r1-kms-SystemKeyArn
    secretsKeyId:
      Fn::ImportValue: espectra-backend-dev-v4-r1-kms-SecretsKeyId
    secretsKeyArn:
      Fn::ImportValue: espectra-backend-dev-v4-r1-kms-SecretsKeyArn

  # Configuración de alarmas
  alarmThresholds:
    lambda:
      errors: 5
      throttles: 5
      duration: 10000
      period: 300
    api:
      latency: 1000
      4xxErrors: 5
      5xxErrors: 1
      period: 300
    dynamodb:
      throttles: 10
      period: 300
    websocket:
      connections: 2000
      period: 300
    costs:
      monthly: 1000

  # Configuración Botpress
  botpressAlarmThresholds:
    errorRate: 5
    latency: 1000
    period: 300
    handoffQueueSize: 50
    handoffLatency: 2000
    tokenUsage: 80
    handoffSuccessRate: 90

  # SNS Topics
  snsHighPriorityTopic: ${ssm:/espectra/${self:provider.stage}/sns/high-priority-topic}
  snsMediumPriorityTopic: ${ssm:/espectra/${self:provider.stage}/sns/medium-priority-topic}
  snsLowPriorityTopic: ${ssm:/espectra/${self:provider.stage}/sns/low-priority-topic}

plugins:
  - serverless-iam-roles-per-function
  - serverless-prune-plugin
  - serverless-plugin-tracing

package:
  individually: true
  patterns:
    - "!./**"
    - "node_modules/@aws-sdk/**"
    - "node_modules/@smithy/**"
    - "node_modules/aws-sdk/**"
    - "node_modules/@aws-sdk/types/**"
    - "node_modules/tslib/**"
    - "node_modules/uuid/**"
    - "node_modules/aws-jwt-verify/**"
    - "!node_modules/@types/**"
    - "../services/**/*.ts"
    - "../services/**/*.js"
    - "../shared/**/*.ts"
    - "../shared/**/*.js"

resources:
  - ${file(infrastructure/monitoring/cloudwatch.yml)}
  - ${file(infrastructure/monitoring/cloudwatch-alarms.yml)}
  - ${file(infrastructure/monitoring/botpress-cloudwatch-alarms.yml)}
  - ${file(infrastructure/monitoring/botpress-cloudwatch-dashboard.yml)}