  #         Statement:
  #           GeoMatchStatement:
  #             CountryCodes:
  #               - CN
  #               - RU
  #               - KP
  #               - IR
  #               - SY
  #         Action:
  #           Block: {}
  #         VisibilityConfig:
  #           SampledRequestsEnabled: true
  #           CloudWatchMetricsEnabled: true
  #           MetricName: GeoBlockMetric

  WebSocketWAFLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/waf/websocket/${self:custom.resourcePrefix}-logs
      RetentionInDays: ${self:custom.logRetentionInDays}
      KmsKeyId:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
      Tags:
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}

  # WAF Association
  # WebSocketWAFAssociation:
  #   Type: AWS::WAFv2::WebACLAssociation
  #   Properties:
  #     ResourceArn: !Sub arn:aws:apigateway:${AWS::Region}::/apis/${WebSocketApi}/stages/${self:provider.stage}
  #     WebACLArn: !GetAtt WebSocketWAFRules.Arn

  # Logging Configuration
  # WebSocketWAFLogging:
  #   Type: AWS::WAFv2::LoggingConfiguration
  #   DependsOn:
  #     - WebSocketWAFRules
  #   Properties:
  #     LogDestinationConfigs:
  #       - arn:aws:logs:us-east-1:345594559631:log-group:/aws/waf/websocket/espectra-backend-dev:*
  #     ResourceArn: !GetAtt WebSocketWAFRules.Arn
  #     RedactedFields:
  #       - SingleHeader:
  #           Name: Authorization
  #       - SingleHeader:
  #           Name: x-api-key

  # IP Set para bloqueos dinámicos
  WebSocketIPSet:
    Type: AWS::WAFv2::IPSet
    Properties:
      Name: ${self:custom.resourcePrefix}-websocket-ipset
      Description: IP Set for dynamic blocking of WebSocket connections
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: []
      Tags:
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}

  # CloudWatch Alarms
  WebSocketAuthorizerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:custom.resourcePrefix}-websocket-authorizer-errors
      AlarmDescription: WebSocket authorizer errors exceeding threshold
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref WsAuthorizerLambdaFunction
      AlarmActions:
        - Fn::ImportValue: ${self:custom.resourcePrefix}-sns-HighPriorityTopicArn

  WebSocketWAFBlocksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:custom.resourcePrefix}-waf-blocks
      AlarmDescription: High number of WAF blocked requests
      MetricName: BlockedRequests
      Namespace: AWS/WAFV2
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: WebACL
          Value: ${self:custom.resourcePrefix}-websocket-waf
        - Name: Region
          Value: ${self:provider.region}
      AlarmActions:
        - Fn::ImportValue: ${self:custom.resourcePrefix}-sns-MediumPriorityTopicArn

  #  AuthorizerRateLimit:
  #   Type: AWS::WAFv2::RateBasedStatement
  #   Properties:
  #     Limit: 100
  #     AggregateKeyType: IP

Outputs:
  # WebSocketWAFArn:
  #   Description: WebSocket WAF ARN
  #   Value: !GetAtt WebSocketWAFRules.Arn
  #   Export:
  #     Name: ${self:custom.resourcePrefix}-websocket-waf-arn

  WebSocketIPSetId:
    Description: WebSocket IP Set ID
    Value:
      Ref: WebSocketIPSet
    Export:
      Name: ${self:custom.resourcePrefix}-websocket-ipset-id
