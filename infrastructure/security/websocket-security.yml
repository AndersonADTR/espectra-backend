Resources:
  # WebSocket Lambda Authorizer
  WebSocketLambdaAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    DependsOn:
      - WsAuthorizerLambdaFunction
    Properties:
      ApiId: !Ref WebSocketApi
      AuthorizerType: REQUEST
      Name: websocket-cognito-authorizer
      AuthorizerUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsAuthorizerLambdaFunction.Arn}/invocations
      IdentitySource:
        - route.request.querystring.Auth
      AuthorizerCredentialsArn:
        Fn::ImportValue: ${self:custom.resourcePrefix}-websocket-authorizer-role-arn

  # WebSocket WAF Rules
  # WebSocketWAFRules:
  #   Type: AWS::WAFv2::WebACL
  #   Properties:
  #     Name: ${self:custom.resourcePrefix}-websocket-waf
  #     Description: WAF rules for WebSocket API
  #     Scope: REGIONAL
  #     DefaultAction:
  #       Allow: {}
  #     VisibilityConfig:
  #       SampledRequestsEnabled: true
  #       CloudWatchMetricsEnabled: true
  #       MetricName: WebSocketWAF
  #     Rules:
  #       - Name: BotControlRule
  #         Priority: 0
  #         Statement:
  #           ManagedRuleGroupStatement:
  #             VendorName: AWS
  #             Name: AWSManagedRulesBotControlRuleSet
  #         OverrideAction:
  #           None: {}
  #         VisibilityConfig:
  #           SampledRequestsEnabled: true
  #           CloudWatchMetricsEnabled: true
  #           MetricName: BotControlMetric

  #       - Name: RateLimit
  #         Priority: 1
  #         Statement:
  #           RateBasedStatement:
  #             Limit: 2000
  #             AggregateKeyType: IP
  #         Action:
  #           Block: {}
  #         VisibilityConfig:
  #           SampledRequestsEnabled: true
  #           CloudWatchMetricsEnabled: true
  #           MetricName: WebSocketRateLimit

  #       - Name: GeoBlockRule
