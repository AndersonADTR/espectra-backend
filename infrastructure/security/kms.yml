Resources:
  # Sistema principal de encriptación para recursos generales
  SystemKMSKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: "${file(./serverless-common.yml):custom.resourcePrefix} main system encryption key"
      EnableKeyRotation: true
      PendingWindowInDays: 30
      MultiRegion: false
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestedRegion':
                  Ref: AWS::Region
          - Sid: AllowLambdaService
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - sqs.amazonaws.com
                - events.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: logs.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
      Tags:
        - Key: Project
          Value: ${file(./serverless-common.yml):custom.projectName}
        - Key: Environment
          Value: ${file(./serverless-common.yml):custom.stage}
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: ${file(./serverless-common.yml):custom.company}
        - Key: Purpose
          Value: SystemEncryption

  SystemKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/${file(./serverless-common.yml):custom.resourcePrefix}-system
      TargetKeyId:
        Ref: SystemKMSKey

  # Clave para encriptar secretos en Secrets Manager
  SecretsKMSKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: "${file(./serverless-common.yml):custom.resourcePrefix} secrets encryption key"
      EnableKeyRotation: true
      PendingWindowInDays: 30
      MultiRegion: false
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestedRegion':
                  Ref: AWS::Region
          - Sid: AllowSecretsManager
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:CreateGrant
            Resource: '*'
      Tags:
        - Key: Project
          Value: ${file(./serverless-common.yml):custom.projectName}
        - Key: Environment
          Value: ${file(./serverless-common.yml):custom.stage}
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: ${file(./serverless-common.yml):custom.company}
        - Key: Purpose
          Value: SecretsEncryption

  SecretsKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/${file(./serverless-common.yml):custom.resourcePrefix}-secrets
      TargetKeyId:
        Ref: SecretsKMSKey

  # Clave para encriptar comunicaciones WebSocket
  WebSocketKMSKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: "${file(./serverless-common.yml):custom.resourcePrefix} websocket encryption key"
      EnableKeyRotation: true
      PendingWindowInDays: 30
      MultiRegion: false
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableIAMUserPermissions
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestedRegion':
                  Ref: AWS::Region
          - Sid: AllowWebSocketService
            Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
              - kms:CreateGrant
            Resource: '*'
      Tags:
        - Key: Project
          Value: ${file(./serverless-common.yml):custom.projectName}
        - Key: Environment
          Value: ${file(./serverless-common.yml):custom.stage}
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: ${file(./serverless-common.yml):custom.company}
        - Key: Purpose
          Value: WebSocketEncryption

  WebSocketKMSAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/${file(./serverless-common.yml):custom.resourcePrefix}-websocket
      TargetKeyId:
        Ref: WebSocketKMSKey

Outputs:
  SystemKeyId:
    Description: ID of the system KMS key
    Value:
      Ref: SystemKMSKey
    Export:
      Name: ${self:custom.resourcePrefix}-kms-SystemKeyId

  SystemKeyArn:
    Description: ARN of the system KMS key
    Value:
      Fn::GetAtt: [SystemKMSKey, Arn]
    Export:
      Name: ${self:custom.resourcePrefix}-kms-SystemKeyArn

  SecretsKeyId:
    Description: ID of the secrets KMS key
    Value:
      Ref: SecretsKMSKey
    Export:
      Name: ${self:custom.resourcePrefix}-kms-SecretsKeyId

  SecretsKeyArn:
    Description: ARN of the secrets KMS key
    Value:
      Fn::GetAtt: [SecretsKMSKey, Arn]
    Export:
      Name: ${self:custom.resourcePrefix}-kms-SecretsKeyArn

  WebsocketKeyId:
    Description: ID of the WebSocket KMS key
    Value:
      Ref: WebSocketKMSKey
    Export:
      Name: ${self:custom.resourcePrefix}-kms-WebsocketKeyId

  WebsocketKeyArn:
    Description: ARN of the WebSocket KMS key
    Value:
      Fn::GetAtt: [WebSocketKMSKey, Arn]
    Export:
      Name: ${self:custom.resourcePrefix}-kms-WebsocketKeyArn