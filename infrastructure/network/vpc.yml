Resources:
  SpectraVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: ${ssm:/espectra/${self:provider.stage}/vpc-cidr, '10.0.0.0/16'}
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: espectra-backend-dev-v4-r1-vpc
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: CreatedBy
          Value: CloudFormation
        - Key: SecurityZone
          Value: restricted

  # VPC Flow Logs
  VPCFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vpc/espectra-backend-dev-v4-r1-flow-logs
      RetentionInDays: 14
      KmsKeyId:
        Fn::ImportValue: espectra-backend-dev-v4-r1-kms-SystemKeyArn

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId:
        Ref: SpectraVPC
      TrafficType: ALL
      LogGroupName:
        Ref: VPCFlowLogGroup
      MaxAggregationInterval: 60
      DeliverLogsPermissionArn:
        Fn::GetAtt: [VPCFlowLogRole, Arn]
      LogDestinationType: cloud-watch-logs
      Tags:
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev

  VPCFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: espectra-backend-dev-v4-r1-vpc-flow-log-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
      - PolicyName: flow-log-policy
        PolicyDocument:
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogStream
                - logs:PutLogEvents
                - logs:DescribeLogGroups
                - logs:DescribeLogStreams
              Resource:
                Fn::Sub: "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/vpc/espectra-backend-dev-v4-r1-flow-logs:*"
            - Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource:
                Fn::ImportValue: espectra-backend-dev-v4-r1-kms-SystemKeyArn

  # Internet Gateway
  SpectraIGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: espectra-backend-dev-v4-r1-igw
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: SpectraVPC
      InternetGatewayId:
        Ref: SpectraIGW

  # NAT Gateway para acceso a internet desde subnets privadas
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: espectra-backend-dev-v4-r1-nat-eip
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId:
        Fn::GetAtt: [NatGatewayEIP, AllocationId]
      SubnetId:
        Ref: PublicSubnet1
      Tags:
        - Key: Name
          Value: espectra-backend-dev-v4-r1-nat
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev

  # Public Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: SpectraVPC
      CidrBlock: ${ssm:/espectra/${self:provider.stage}/public-subnet-cidrs}
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: espectra-backend-dev-v4-r1-public-1
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: Type
          Value: Public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: SpectraVPC
      CidrBlock: ${ssm:/espectra/${self:provider.stage}/public-subnet-2-cidrs}
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: espectra-backend-dev-v4-r1-public-2
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: Type
          Value: Public

  # Private Subnets para Lambda
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SpectraVPC
      CidrBlock: ${ssm:/espectra/${self:provider.stage}/private-subnet-1-cidrs, '10.0.3.0/24'}
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-private-1
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}
        - Key: Type
          Value: Private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SpectraVPC
      CidrBlock: ${ssm:/espectra/${self:provider.stage}/private-subnet-2-cidrs, '10.0.4.0/24'}
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-private-2
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}
        - Key: Type
          Value: Private

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SpectraVPC
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-public-rt
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SpectraVPC
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-private-rt
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SpectraIGW

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Network ACLs
  PublicNACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref SpectraVPC
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-public-nacl
        - Key: Environment
          Value: ${self:provider.stage}

  PrivateNACL:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref SpectraVPC
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-private-nacl
        - Key: Environment
          Value: ${self:provider.stage}

  PublicNACLInboundHTTPS:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNACL
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443

  PublicNACLInboundHTTP:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNACL
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80

  PublicNACLInboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNACL
      RuleNumber: 120
      Protocol: 6
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 1024
        To: 65535

  PublicNACLOutbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PublicNACL
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  PrivateNACLInboundFromPublic:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNACL
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: ${ssm:/espectra/${self:provider.stage}/vpc-cidr}

  PrivateNACLOutbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref PrivateNACL
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  # VPC Endpoints
  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - dynamodb:*
            Resource: '*'
      VpcId: !Ref SpectraVPC
      RouteTableIds:
        - !Ref PrivateRouteTable
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-dynamodb-endpoint
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}

  ApiGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.execute-api
      VpcId: !Ref SpectraVPC
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-api-endpoint
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcId: !Ref SpectraVPC
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-secrets-endpoint
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcId: !Ref SpectraVPC
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcId: !Ref SpectraVPC
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-ssm-endpoint
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      VpcId: !Ref SpectraVPC
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      Tags:
        - Key: Name
          Value: ${self:custom.service}-${self:provider.stage}-ssmmessages-endpoint
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}

Outputs:
  # VPC Outputs
  VpcId:
    Description: VPC ID
    Value:
      Ref: SpectraVPC
    Export:
      Name: espectra-backend-dev-v4-r1-phase1-VpcId

  VpcCidr:
    Description: VPC CIDR Block
    Value:
      Fn::GetAtt: [SpectraVPC, CidrBlock]
    Export:
      Name: espectra-backend-dev-v4-r1-phase1-VpcCidr

  # Subnet Outputs
  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value:
      Ref: PublicSubnet1
    Export:
      Name: espectra-backend-dev-v4-r1-phase1-PublicSubnet1Id

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value:
      Ref: PublicSubnet2
    Export:
      Name: espectra-backend-dev-v4-r1-phase1-PublicSubnet2Id

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value:
      Ref: PrivateSubnet1
    Export:
      Name: espectra-backend-dev-v4-r1-phase1-PrivateSubnet1Id

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value:
      Ref: PrivateSubnet2
    Export:
      Name: espectra-backend-dev-v4-r1-phase1-PrivateSubnet2Id

  # Route Table Outputs
  PublicRouteTableId:
    Description: Public Route Table ID
    Value:
      Ref: PublicRouteTable
    Export:
      Name: espectra-backend-dev-v4-r1-phase1-PublicRouteTableId

  PrivateRouteTableId:
    Description: Private Route Table ID
    Value:
      Ref: PrivateRouteTable
    Export:
      Name: espectra-backend-dev-v4-r1-phase1-PrivateRouteTableId