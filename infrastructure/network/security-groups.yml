Resources:
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId:
        Ref: SpectraVPC
      SecurityGroupEgress:
        # Redis
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: 0.0.0.0/0
          Description: Outbound traffic to Redis
        # HTTPS para APIs y servicios AWS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS services and APIs
        # DNS
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS (TCP)
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS (UDP)
      Tags:
        - Key: Name
          Value: ${self:custom.resourcePrefix}-lambda-sg
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: Component
          Value: Lambda
        - Key: ManagedBy
          Value: CloudFormation

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Redis cluster
      VpcId:
        Ref: SpectraVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId:
            Ref: LambdaSecurityGroup
          Description: Redis access from Lambda functions
      Tags:
        - Key: Name
          Value: ${self:custom.resourcePrefix}-redis-sg
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: Component
          Value: Redis
        - Key: ManagedBy
          Value: CloudFormation

  InternalApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for internal API endpoints
      VpcId:
        Ref: SpectraVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0  # Cambiado a CidrIp para evitar la dependencia circular
          Description: HTTPS from Lambda functions
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound
      Tags:
        - Key: Name
          Value: ${self:custom.resourcePrefix}-internal-api-sg
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: Component
          Value: InternalAPI
        - Key: ManagedBy
          Value: CloudFormation

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC Endpoints
      VpcId:
        Ref: SpectraVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0  # Cambiado a CidrIp para evitar la dependencia circular
          Description: HTTPS from Lambda functions
      SecurityGroupEgress:
        - IpProtocol: -1
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
          Description: All outbound traffic
      Tags:
        - Key: Name
          Value: ${self:custom.resourcePrefix}-vpce-sg
        - Key: Service
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: Component
          Value: VPCEndpoints
        - Key: ManagedBy
          Value: CloudFormation

  # Eliminar RedisSecurityGroupIngress y LambdaSecurityGroupEgress

  SGMetricsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:custom.resourcePrefix}-sg-blocked-requests
      MetricName: BlockedRequests
      Namespace: AWS/EC2
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - Fn::ImportValue: ${self:custom.resourcePrefix}-sns-HighPriorityTopicArn

Outputs:
  # Security Group Outputs
  LambdaSecurityGroupId:
    Description: ID of the Lambda Security Group
    Value:
      Ref: LambdaSecurityGroup
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-LambdaSecurityGroupId

  RedisSecurityGroupId:
    Description: ID of the Redis Security Group
    Value:
      Ref: RedisSecurityGroup
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-RedisSecurityGroupId

  InternalApiSecurityGroupId:
    Description: ID of the Internal API Security Group
    Value:
      Ref: InternalApiSecurityGroup
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-InternalApiSecurityGroupId

  VPCEndpointSecurityGroupId:
    Description: ID of the VPC Endpoint Security Group
    Value:
      Ref: VPCEndpointSecurityGroup
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-VPCEndpointSecurityGroupId