Resources:
  # User Pool principal para autenticación de usuarios
  SpectraUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ${self:custom.resourcePrefix}-user-pool
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        InviteMessageTemplate:
          EmailMessage: "Your username is {username} and temporary password is {####}."
          EmailSubject: "Welcome to Espectra Platform"
          SMSMessage: "Your username is {username} and temporary password is {####}"
      SmsConfiguration:
        SnsCallerArn: !GetAtt CognitoSMSRole.Arn
        ExternalId: ${self:custom.resourcePrefix}-external
      AutoVerifiedAttributes:
        - email
        - phone_number
      UsernameAttributes:
        - email
        - phone_number
      MfaConfiguration: ${self:custom.cognito.userPool.mfaConfiguration}
      EnabledMfas:
        - SMS_MFA
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
          - Name: verified_phone_number
            Priority: 2
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        From: ${self:custom.cognito.userPool.emailSender}
        SourceArn: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${self:custom.cognito.userPool.emailSender}"
      Policies:
        PasswordPolicy:
          MinimumLength: ${self:custom.cognito.userPool.passwordPolicy.minLength}
          RequireLowercase: ${self:custom.cognito.userPool.passwordPolicy.requireLowercase}
          RequireNumbers: ${self:custom.cognito.userPool.passwordPolicy.requireNumbers}
          RequireSymbols: ${self:custom.cognito.userPool.passwordPolicy.requireSymbols}
          RequireUppercase: ${self:custom.cognito.userPool.passwordPolicy.requireUppercase}
          TemporaryPasswordValidityDays: ${self:custom.cognito.userPool.passwordPolicy.temporaryPasswordValidityDays}
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "3"
            MaxLength: "254"
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "256"
        - Name: phone_number
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: userType
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MaxLength: "20"
            MinLength: "1"
        - Name: language
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MaxLength: "10"
            MinLength: "2"
      UserPoolTags:
          Project: espectra-backend
          Environment: dev
          ManagedBy: serverless
          Company: technoapes
          Component: UserPool
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED

  # Cliente para interactuar con el User Pool
  SpectraUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: espectra-backend-dev-v4-r1-user-pool-client
      UserPoolId:
        Ref: SpectraUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      GenerateSecret: true
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: "hours"
        IdToken: "hours"
        RefreshToken: "days"
      EnableTokenRevocation: true
      EnablePropagateAdditionalUserContextData: true
      AuthSessionValidity: 3
      ReadAttributes:
        - email
        - name
        - phone_number
        - custom:userType
        - custom:language
      WriteAttributes:
        - email
        - name
        - phone_number
        - custom:userType
        - custom:language

  # Servidor de recursos para definir scopes de API
  SpectraUserPoolResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: espectra-api
      Name: Espectra API
      UserPoolId:
        Ref: SpectraUserPool
      Scopes:
        - ScopeName: read
          ScopeDescription: Read access to API
        - ScopeName: write
          ScopeDescription: Write access to API
        - ScopeName: admin
          ScopeDescription: Admin access to API
        - ScopeName: concierge
          ScopeDescription: Access to concierge services

  # Dominio personalizado para el User Pool
  SpectraUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: espectra-backend-dev-v4-r1-auth
      UserPoolId:
        Ref: SpectraUserPool

  # Alarma para monitorear errores de inicio de sesión
  CognitoSignInErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: espectra-backend-dev-v4-r1-cognito-sign-in-errors
      AlarmDescription: Alert on high number of sign-in failures
      MetricName: SignInErrors
      Namespace: AWS/Cognito
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: UserPool
          Value:
            Ref: SpectraUserPool
      # AlarmActions:
      #   - Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyId
      Tags:
        - Key: Project
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: technoapes
        - Key: Component
          Value: Alarm

  # Alarma para detectar credenciales comprometidas
  CognitoCompromisedCredentialsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: espectra-backend-dev-v4-r1-cognito-compromised-credentials
      AlarmDescription: Alert on compromised credentials detection
      MetricName: CompromisedCredentialsRisk
      Namespace: AWS/Cognito
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: UserPool
          Value:
            Ref: SpectraUserPool
      # AlarmActions:
      #   - Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyId
      Tags:
        - Key: Project
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: technoapes
        - Key: Component
          Value: Alarm

  # Rol para permitir a Cognito enviar SMS
  CognitoSMSRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: espectra-backend-dev-v4-r1-cognito-sms-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'aws:SourceAccount':
                  Ref: AWS::AccountId
      Policies:
        - PolicyName: cognito-sms-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: '*'
      Tags:
        - Key: Project
          Value: espectra-backend
        - Key: Environment
          Value: dev
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: technoapes
        - Key: Component
          Value: IAMRole

Outputs:
  UserPoolId:
    Value:
      Ref: SpectraUserPool
    Export:
      Name: ${self:custom.resourcePrefix}-cognito-UserPoolId

  UserPoolClientId:
    Value:
      Ref: SpectraUserPoolClient
    Export:
      Name: ${self:custom.resourcePrefix}-cognito-UserPoolClientId

  UserPoolArn:
    Value:
      Fn::GetAtt: [SpectraUserPool, Arn]
    Export:
      Name: ${self:custom.resourcePrefix}-cognito-UserPoolArn

  UserPoolDomain:
    Value:
      Fn::Sub: "${self:custom.resourcePrefix}-auth.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: ${self:custom.resourcePrefix}-cognito-UserPoolDomain