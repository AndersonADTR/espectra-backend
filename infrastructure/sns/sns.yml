Resources:
  # Tópico de alta prioridad para alertas críticas
  HighPriorityTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ${self:custom.resourcePrefix}-high-priority
      KmsMasterKeyId:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
      Tags:
        - Key: Project
          Value: ${self:custom.projectName}
        - Key: Environment
          Value: ${self:custom.stage}
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: ${self:custom.company}
        - Key: Priority
          Value: High

  HighPriorityTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        -
            Ref: HighPriorityTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
                - lambda.amazonaws.com
            Action: sns:Publish
            Resource:
              Ref: HighPriorityTopic

  # Tópico de prioridad media para alertas operacionales
  MediumPriorityTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ${self:custom.resourcePrefix}-medium-priority
      KmsMasterKeyId:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
      Tags:
        - Key: Project
          Value: ${self:custom.projectName}
        - Key: Environment
          Value: ${self:custom.stage}
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: ${self:custom.company}
        - Key: Priority
          Value: Medium

  MediumPriorityTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        -
            Ref: MediumPriorityTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
                - lambda.amazonaws.com
            Action: sns:Publish
            Resource:
              Ref: MediumPriorityTopic

  # Tópico de baja prioridad para notificaciones informativas
  LowPriorityTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ${self:custom.resourcePrefix}-low-priority
      KmsMasterKeyId:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
      Tags:
        - Key: Project
          Value: ${self:custom.projectName}
        - Key: Environment
          Value: ${self:custom.stage}
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: ${self:custom.company}
        - Key: Priority
          Value: Low

  LowPriorityTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        -
            Ref: LowPriorityTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - cloudwatch.amazonaws.com
                - events.amazonaws.com
                - lambda.amazonaws.com
            Action: sns:Publish
            Resource:
              Ref: LowPriorityTopic

  # Suscripciones por email para cada nivel de prioridad
  HighPriorityEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: HighPriorityTopic
      Protocol: email
      Endpoint: ${self:custom.sns.subscriptions.highPriorityEmail}

  MediumPriorityEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: MediumPriorityTopic
      Protocol: email
      Endpoint: ${self:custom.sns.subscriptions.mediumPriorityEmail}

  LowPriorityEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        Ref: LowPriorityTopic
      Protocol: email
      Endpoint: ${self:custom.sns.subscriptions.lowPriorityEmail}

  # Alarmas para monitorear el estado de los tópicos SNS
  TopicDeliveryErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:custom.resourcePrefix}-sns-delivery-errors
      AlarmDescription: Alert on SNS message delivery failures
      MetricName: NumberOfNotificationsFailed
      Namespace: AWS/SNS
      Statistic: Sum
      Period: ${self:custom.sns.alarms.period}
      EvaluationPeriods: ${self:custom.sns.alarms.evaluationPeriods}
      Threshold: ${self:custom.sns.alarms.deliveryErrorThreshold}
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: TopicName
          Value:
            Fn::GetAtt: [HighPriorityTopic, TopicName]
      AlarmActions:
        -
            Ref: HighPriorityTopic
      Tags:
        - Key: Project
          Value: ${self:custom.projectName}
        - Key: Environment
          Value: ${self:custom.stage}
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: ${self:custom.company}
        - Key: Component
          Value: Alarm

  TopicThrottlingAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:custom.resourcePrefix}-sns-throttling
      AlarmDescription: Alert on SNS throttling
      MetricName: NumberOfNotificationsFilteredOut-InvalidAttributes
      Namespace: AWS/SNS
      Statistic: Sum
      Period: ${self:custom.sns.alarms.period}
      EvaluationPeriods: ${self:custom.sns.alarms.evaluationPeriods}
      Threshold: ${self:custom.sns.alarms.throttlingThreshold}
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        -
            Ref: HighPriorityTopic
      Tags:
        - Key: Project
          Value: ${self:custom.projectName}
        - Key: Environment
          Value: ${self:custom.stage}
        - Key: ManagedBy
          Value: serverless
        - Key: Company
          Value: ${self:custom.company}
        - Key: Component
          Value: Alarm

Outputs:
  HighPriorityTopicArn:
    Description: ARN of the high priority SNS topic
    Value:
      Ref: HighPriorityTopic
    Export:
      Name: ${self:custom.resourcePrefix}-sns-HighPriorityTopicArn

  MediumPriorityTopicArn:
    Description: ARN of the medium priority SNS topic
    Value:
      Ref: MediumPriorityTopic
    Export:
      Name: ${self:custom.resourcePrefix}-sns-MediumPriorityTopicArn

  LowPriorityTopicArn:
    Description: ARN of the low priority SNS topic
    Value:
      Ref: LowPriorityTopic
    Export:
      Name: ${self:custom.resourcePrefix}-sns-LowPriorityTopicArn