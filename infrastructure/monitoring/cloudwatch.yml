Resources:
  # Log Groups
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/${self:custom.resourcePrefix}
      RetentionInDays: ${self:custom.logRetentionInDays}
      KmsKeyId:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
      Tags:
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}
        - Key: Component
          Value: APIGateway

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/${self:custom.resourcePrefix}
      RetentionInDays: ${self:custom.logRetentionInDays}
      KmsKeyId:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
      Tags:
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}
        - Key: Component
          Value: Lambda

  MetricsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /custom/${self:custom.resourcePrefix}/metrics
      RetentionInDays: ${self:custom.logRetentionInDays}
      KmsKeyId:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
      Tags:
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}
        - Key: Component
          Value: Metrics

  BotpressLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /custom/${self:custom.resourcePrefix}/botpress
      RetentionInDays: ${self:custom.logRetentionInDays}
      KmsKeyId:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
      Tags:
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}
        - Key: Component
          Value: Botpress

  WebSocketLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /custom/${self:custom.resourcePrefix}/websocket
      RetentionInDays: ${self:custom.logRetentionInDays}
      KmsKeyId:
        Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn
      Tags:
        - Key: Service
          Value: ${self:custom.service}
        - Key: Environment
          Value: ${self:provider.stage}
        - Key: Component
          Value: WebSocket

  # IAM Roles
  CloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ${self:custom.resourcePrefix}-cloudwatch-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - apigateway.amazonaws.com
                - lambda.amazonaws.com
                - events.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
      Policies:
        - PolicyName: cloudwatch-custom-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/custom/*
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource:
                  - Fn::ImportValue: ${self:custom.resourcePrefix}-kms-SystemKeyArn

  # CloudWatch Dashboard
  MainDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: ${self:custom.resourcePrefix}-main
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "width": 24,
              "height": 3,
              "properties": {
                "view": "singleValue",
                "metrics": [
                  [ "AWS/ApiGateway", "4XXError", "ApiName", "${self:custom.service}" ],
                  [ ".", "5XXError", ".", "." ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${self:custom.resourcePrefix}-*" ],
                  [ "AWS/DynamoDB", "ThrottledRequests", "TableName", "${self:custom.resourcePrefix}-*" ],
                  [ "${self:custom.service}/${self:provider.stage}", "ActiveConnections", "Service", "WebSocket" ],
                  [ ".", "BotpressErrors", "Service", "Botpress" ]
                ],
                "region": "${AWS::Region}",
                "period": 300,
                "title": "System Health Overview"
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${self:custom.resourcePrefix}-*" ],
                  [ ".", "Errors", ".", "." ],
                  [ ".", "Throttles", ".", "." ],
                  [ ".", "Duration", ".", "." ]
                ],
                "period": 300,
                "stat": "Sum",
                "region": "${AWS::Region}",
                "title": "Lambda Metrics"
              }
            },
            {
              "type": "metric",
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "${self:custom.service}", { "stat": "Sum" } ],
                  [ ".", "Latency", ".", ".", { "stat": "Average" } ],
                  [ ".", "4XXError", ".", ".", { "stat": "Sum" } ],
                  [ ".", "5XXError", ".", ".", { "stat": "Sum" } ]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "title": "API Gateway Metrics"
              }
            },
            {
              "type": "log",
              "width": 24,
              "height": 6,
              "properties": {
                "query": "SOURCE '/aws/lambda/${self:custom.resourcePrefix}-*' | fields @timestamp, @message\n| filter @message like /ERROR/\n| sort @timestamp desc\n| limit 20",
                "region": "${AWS::Region}",
                "title": "Recent Error Logs",
                "view": "table"
              }
            }
          ]
        }

Outputs:
  CloudWatchRoleArn:
    Description: ARN of the CloudWatch IAM role
    Value:
      Fn::GetAtt: [CloudWatchRole, Arn]
    Export:
      Name: ${self:custom.resourcePrefix}-cloudwatch-role-arn

  ApiGatewayLogGroupName:
    Description: Name of the API Gateway log group
    Value:
      Ref: ApiGatewayLogGroup
    Export:
      Name: ${self:custom.resourcePrefix}-apigateway-log-group

  LambdaLogGroupName:
    Description: Name of the Lambda log group
    Value:
      Ref: LambdaLogGroup
    Export:
      Name: ${self:custom.resourcePrefix}-lambda-log-group

  MetricsLogGroupName:
    Description: Name of the metrics log group
    Value:
      Ref: MetricsLogGroup
    Export:
      Name: ${self:custom.resourcePrefix}-metrics-log-group

  BotpressLogGroupName:
    Description: Name of the Botpress log group
    Value:
      Ref: BotpressLogGroup
    Export:
      Name: ${self:custom.resourcePrefix}-botpress-log-group

  WebSocketLogGroupName:
    Description: Name of the WebSocket log group
    Value:
      Ref: WebSocketLogGroup
    Export:
      Name: ${self:custom.resourcePrefix}-websocket-log-group

  MainDashboardURL:
    Description: URL of the main CloudWatch dashboard
    Value:
      Fn::Sub: "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${self:custom.resourcePrefix}-main"
    Export:
      Name: ${self:custom.resourcePrefix}-main-dashboard-url