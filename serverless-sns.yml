# serverless-sns.yml
# Descripción: Define los tópicos SNS para notificaciones y alertas del sistema
# Dependencias: serverless-kms.yml (para encriptación de tópicos)
# Orden de despliegue: 2

service: espectra-backend-sns-v4r1

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  tags:
    Project: espectra-backend
    Environment: dev
    Component: SNS
    Purpose: Notifications
    ManagedBy: serverless
    Company: technoapes

custom:
  projectName: espectra-backend
  stage: dev
  deploymentId: v4-r1
  resourcePrefix: espectra-backend-dev-v4-r1
  # Configuraciones específicas para SNS
  sns:
    subscriptions:
      highPriorityEmail: soporte@spectrumai.com.co
      mediumPriorityEmail: soporte@spectrumai.com.co
      lowPriorityEmail: soporte@spectrumai.com.co
    alarms:
      deliveryErrorThreshold: 1
      throttlingThreshold: 1
      evaluationPeriods: 1
      period: 300

resources:
  - ${file(infrastructure/sns/sns.yml)}

