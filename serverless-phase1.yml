# serverless-phase1.yml
# Descripción: Define la infraestructura de red base (VPC, subnets, security groups)
# Dependencias: serverless-kms.yml, serverless-sns.yml (para alarmas)
# Orden de despliegue: 4

service: espectra-backend-phase1-v4r1

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  tags:
    Project: espectra-backend
    Environment: dev
    Component: Network
    Purpose: Infrastructure
    ManagedBy: serverless
    Company: technoapes

custom:
  projectName: espectra-backend
  stage: dev
  deploymentId: v4-r1
  resourcePrefix: espectra-backend-dev-v4-r1
  service: espectra-backend
  logRetentionInDays: 14
  company: technoapes
  # Configuraciones específicas para la red
  network:
    vpc:
      cidr: ${ssm:/espectra/${self:custom.stage}/vpc-cidr, '10.0.0.0/16'}
      flowLogs:
        enabled: true
        retentionInDays: 14
    subnets:
      public1:
        cidr: ${ssm:/espectra/${self:custom.stage}/public-subnet-cidrs, '10.0.1.0/24'}
      public2:
        cidr: ${ssm:/espectra/${self:custom.stage}/public-subnet-2-cidrs, '10.0.2.0/24'}
      private1:
        cidr: ${ssm:/espectra/${self:custom.stage}/private-subnet-1-cidrs, '10.0.3.0/24'}
      private2:
        cidr: ${ssm:/espectra/${self:custom.stage}/private-subnet-2-cidrs, '10.0.4.0/24'}
    securityGroups:
      alarms:
        blockedRequestsThreshold: 100
        evaluationPeriods: 2
        period: 300

resources:
  - ${file(infrastructure/network/vpc.yml)}
  - ${file(infrastructure/network/security-groups.yml)}

outputs:
  # VPC Outputs
  VpcId:
    Description: VPC ID
    Value:
      Ref: SpectraVPC
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-VpcId

  VpcCidr:
    Description: VPC CIDR Block
    Value:
      Fn::GetAtt: [SpectraVPC, CidrBlock]
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-VpcCidr

  # Subnet Outputs
  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value:
      Ref: PublicSubnet1
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-PublicSubnet1Id

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value:
      Ref: PublicSubnet2
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-PublicSubnet2Id

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value:
      Ref: PrivateSubnet1
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-PrivateSubnet1Id

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value:
      Ref: PrivateSubnet2
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-PrivateSubnet2Id

  # Route Table Outputs
  PublicRouteTableId:
    Description: Public Route Table ID
    Value:
      Ref: PublicRouteTable
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-PublicRouteTableId

  PrivateRouteTableId:
    Description: Private Route Table ID
    Value:
      Ref: PrivateRouteTable
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-PrivateRouteTableId

  # Security Group Outputs
  LambdaSecurityGroupId:
    Description: ID of the Lambda Security Group
    Value:
      Ref: LambdaSecurityGroup
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-LambdaSecurityGroupId

  RedisSecurityGroupId:
    Description: ID of the Redis Security Group
    Value:
      Ref: RedisSecurityGroup
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-RedisSecurityGroupId

  InternalApiSecurityGroupId:
    Description: ID of the Internal API Security Group
    Value:
      Ref: InternalApiSecurityGroup
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-InternalApiSecurityGroupId

  VPCEndpointSecurityGroupId:
    Description: ID of the VPC Endpoint Security Group
    Value:
      Ref: VPCEndpointSecurityGroup
    Export:
      Name: ${self:custom.resourcePrefix}-phase1-VPCEndpointSecurityGroupId