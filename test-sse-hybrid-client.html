        }
        .btn-danger {

        .btn-danger:hover {

        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: 600;
        }
        .status.connected {
            background: #c6f6d5;
            color: #22543d;
            border: 2px solid #9ae6b4;
        }
        .status.disconnected {
            background: #fed7d7;
            color: #742a2a;
            border: 2px solid #fc8181;
        }
        .status.connecting {
            background: #fef5e7;
            color: #744210;
            border: 2px solid #f6e05e;
        }
        .messages {
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            margin: 20px 0;
        }
        .message {
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .message.error {
            background: #fed7d7;
            border-left-color: #e53e3e;
        }
        .message.success {
            background: #c6f6d5;
            border-left-color: #38a169;
        }
        .message.info {
            background: #bee3f8;
            border-left-color: #3182ce;
        }
        .timestamp {
            font-size: 12px;
            color: #718096;
            margin-bottom: 5px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-label {
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

            <div class="input-group">

        <div id="connectionStatus" class="status disconnected">

            </div>
            <div class="stat-card">
                <div class="stat-value" id="pollRequests">0</div>
                <div class="stat-label">Requests Polling</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="reconnects">0</div>
                <div class="stat-label">Reconexiones</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uptime">0s</div>
                <div class="stat-label">Tiempo Activo</div>
            </div>
        </div>

        <h3>Mensajes SSE + Polling Recibidos</h3>
        <div id="messages" class="messages"></div>
    </div>

    <script>
        let eventSource = null;
        let pollingInterval = null;
        let connectionStartTime = null;
        let uptimeInterval = null;
        let lastMessageTimestamp = null;
        
        // Contadores
        let sseEventCount = 0;
        let pollRequestCount = 0;
        let reconnectCount = 0;

        function updateStatus(status, message) {
            const statusEl = document.getElementById('connectionStatus');
            statusEl.className = `status ${status}`;
            statusEl.textContent = message;
        }

        function addMessage(type, content, source = 'SSE') {
            const messagesEl = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            messageEl.innerHTML = `
                <div class="timestamp">${timestamp} - ${source}</div>
                <div>${content}</div>
            `;
            
            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function updateStats() {
            document.getElementById('sseEvents').textContent = sseEventCount;
            document.getElementById('pollRequests').textContent = pollRequestCount;
            document.getElementById('reconnects').textContent = reconnectCount;
        }

        function startUptime() {
            connectionStartTime = Date.now();
            uptimeInterval = setInterval(() => {
                if (connectionStartTime) {
                    const uptime = Math.floor((Date.now() - connectionStartTime) / 1000);
                    document.getElementById('uptime').textContent = `${uptime}s`;
                }
            }, 1000);
        }

        function stopUptime() {
            if (uptimeInterval) {
                clearInterval(uptimeInterval);
                uptimeInterval = null;
            }
            connectionStartTime = null;
            document.getElementById('uptime').textContent = '0s';
        }

        function connectSSE() {
            const apiUrl = document.getElementById('apiUrl').value;
            const conversationId = document.getElementById('conversationId').value;
            const userId = document.getElementById('userId').value;
            const token = document.getElementById('jwtToken').value;

            const url = `${apiUrl}/conversations/${conversationId}/listen?userId=${userId}`;
            
            updateStatus('connecting', '🔄 Conectando SSE...');
            
            eventSource = new EventSource(url, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            eventSource.onopen = function(event) {
                updateStatus('connected', '✅ SSE Conectado - Escuchando eventos');
                addMessage('success', 'Conexión SSE establecida exitosamente');
                sseEventCount++;
                updateStats();
            };

            eventSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    addMessage('info', `Mensaje recibido: ${JSON.stringify(data, null, 2)}`);
                    lastMessageTimestamp = new Date().toISOString();
                } catch (e) {
                    addMessage('info', `Evento SSE: ${event.data}`);
                }
                sseEventCount++;
                updateStats();
            };

            eventSource.onerror = function(error) {
                updateStatus('disconnected', '❌ Error SSE - Iniciando reconexión automática');
                addMessage('error', `Error SSE: ${JSON.stringify(error)}`);
                
                // Cerrar SSE y cambiar a polling
                if (eventSource) {
                    eventSource.close();
                    eventSource = null;
                }
                
                // Iniciar polling como fallback
                setTimeout(() => {
                    startPolling();
                    reconnectCount++;
                    updateStats();
                }, 2000);
            };

            // Eventos específicos
            eventSource.addEventListener('connection', function(event) {
                const data = JSON.parse(event.data);
                addMessage('success', `Evento de conexión: ${JSON.stringify(data, null, 2)}`);
                sseEventCount++;
                updateStats();
            });

            eventSource.addEventListener('BOT_RESPONSE', function(event) {
                const data = JSON.parse(event.data);
                addMessage('info', `Respuesta del Bot: ${JSON.stringify(data, null, 2)}`);
                sseEventCount++;
                updateStats();
            });
        }

        function startPolling() {
            const apiUrl = document.getElementById('apiUrl').value;
            const conversationId = document.getElementById('conversationId').value;
            const userId = document.getElementById('userId').value;
            const token = document.getElementById('jwtToken').value;

            updateStatus('connected', '🔄 Modo Polling Activo - Consultando cada 2 segundos');
            
            pollingInterval = setInterval(async () => {
                try {
                    let url = `${apiUrl}/conversations/${conversationId}/poll?userId=${userId}`;
                    if (lastMessageTimestamp) {
                        url += `&since=${encodeURIComponent(lastMessageTimestamp)}`;
                    }

                    const response = await fetch(url, {
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Accept': 'application/json'
                        }
                    });

                    pollRequestCount++;
                    updateStats();

                    if (response.ok) {
                        const data = await response.json();
                        
                        if (data.messages && data.messages.length > 0) {
                            data.messages.forEach(message => {
                                addMessage('info', `Mensaje (Polling): ${JSON.stringify(message, null, 2)}`, 'POLL');
                            });
                            lastMessageTimestamp = data.timestamp;
                        }
                    } else {
                        addMessage('error', `Error en polling: ${response.status} ${response.statusText}`, 'POLL');
                    }
                } catch (error) {
                    addMessage('error', `Error en polling: ${error.message}`, 'POLL');
                }
            }, 2000); // Polling cada 2 segundos
        }

        function connectHybrid() {
            disconnect(); // Limpiar conexiones existentes
            
            // Iniciar con SSE
            connectSSE();
            startUptime();
            
            addMessage('info', 'Iniciando conexión híbrida: SSE + Polling fallback');
        }

        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            
            stopUptime();
            updateStatus('disconnected', '❌ Desconectado - Conexión cerrada manualmente');
            addMessage('info', 'Conexión cerrada manualmente');
        }

        function testPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
            }
            
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            
            startPolling();
            startUptime();
            addMessage('info', 'Modo de prueba: Solo Polling activado');
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
            sseEventCount = 0;
            pollRequestCount = 0;
            reconnectCount = 0;
            updateStats();
        }

        // Cleanup al cerrar la página
        window.addEventListener('beforeunload', function() {
            disconnect();
        });
    </script>
</body>
