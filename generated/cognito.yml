service: espectra-backend-cognito-v4r1
provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  tags:
    Project: espectra-backend
    Environment: dev
    Component: Cognito
    ManagedBy: serverless
    Company: technoapes
custom:
  projectName: espectra-backend
  stage: dev
  deploymentId: v4r1
  resourcePrefix: espectra-backend-dev-v4r1
  cognito:
    userPool:
      emailSender: soporte@spectrumai.com.co
      mfaConfiguration: OPTIONAL
      passwordPolicy:
        minLength: 8
        requireLowercase: true
        requireUppercase: true
        requireNumbers: true
        requireSymbols: true
        temporaryPasswordValidityDays: 7
    userPoolClient:
      accessTokenValidity: 1
      idTokenValidity: 1
      refreshTokenValidity: 30
      authSessionValidity: 3
    alarms:
      signInErrorsThreshold: 10
      signInErrorsEvaluationPeriods: 2
      compromisedCredentialsThreshold: 1
      period: 300
resources:
  - ${file(infrastructure/cognito/cognito.yml)}
outputs:
  UserPoolId:
    Value:
      Ref: SpectraUserPool
    Export:
      Name: ${self:custom.resourcePrefix}-cognito.UserPoolId
  UserPoolClientId:
    Value:
      Ref: SpectraUserPoolClient
    Export:
      Name: ${self:custom.resourcePrefix}-cognito.UserPoolClientId
  UserPoolArn:
    Value:
      Fn::GetAtt:
        - SpectraUserPool
        - Arn
    Export:
      Name: ${self:custom.resourcePrefix}-cognito.UserPoolArn
  UserPoolDomain:
    Value:
      Fn::Sub: ${self:custom.resourcePrefix}-auth.auth.${AWS::Region}.amazoncognito.com
    Export:
      Name: ${self:custom.resourcePrefix}-cognito.UserPoolDomain
