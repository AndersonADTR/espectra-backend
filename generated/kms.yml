service: espectra-backend-kms-v4r1
provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  tags:
    Project: espectra-backend
    Environment: dev
    Component: Kms
    ManagedBy: serverless
    Company: technoapes
custom:
  projectName: espectra-backend
  stage: dev
  deploymentId: v4r1
  resourcePrefix: espectra-backend-dev-v4r1
resources:
  - ${file(infrastructure/security/kms.yml)}
outputs:
  SystemKeyId:
    Value:
      Ref: SystemKMSKey
    Export:
      Name: ${self:custom.resourcePrefix}-kms-SystemKeyId
  SystemKeyArn:
    Value:
      Fn::GetAtt:
        - SystemKMSKey
        - Arn
    Export:
      Name: ${self:custom.resourcePrefix}-kms-SystemKeyArn
  SecretsKeyId:
    Value:
      Ref: SecretsKMSKey
    Export:
      Name: ${self:custom.resourcePrefix}-kms-SecretsKeyId
  SecretsKeyArn:
    Value:
      Fn::GetAtt:
        - SecretsKMSKey
        - Arn
    Export:
      Name: ${self:custom.resourcePrefix}-kms-SecretsKeyArn
  WebsocketKeyId:
    Value:
      Ref: WebSocketKMSKey
    Export:
      Name: ${self:custom.resourcePrefix}-kms-WebsocketKeyId
  WebsocketKeyArn:
    Value:
      Fn::GetAtt:
        - WebSocketKMSKey
        - Arn
    Export:
      Name: ${self:custom.resourcePrefix}-kms-WebsocketKeyArn
