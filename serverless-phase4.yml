service: espectra-backend-phase4-v4r1

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  memorySize: 1024
  timeout: 29
  logRetentionInDays: 14

  httpApi:
    cors: true

  # Configuración para REST API Gateway
  apiGateway:
    restApiId: !Ref RestApiId
    restApiRootResourceId: !GetAtt RestApiId.RootResourceId
    binaryMediaTypes:
      - '*/*'
    # Configuración detallada de CORS
    cors:
      allowOrigin: '*'
      allowHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Requested-With
        - X-Amz-User-Agent
      allowMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      # Nota: No podemos usar allowCredentials: true con allowOrigin: '*'
      # allowCredentials: true
      exposeHeaders:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent

  tracing:
    lambda: true

  vpc:
    securityGroupIds:
      - Fn::ImportValue: ${self:custom.resourcePrefix}-phase1-LambdaSecurityGroupId
    subnetIds:
      - Fn::ImportValue: ${self:custom.resourcePrefix}-phase1-PrivateSubnet1Id
      - Fn::ImportValue: ${self:custom.resourcePrefix}-phase1-PrivateSubnet2Id

  environment:
    # System Variables
    STAGE: dev
    REGION: us-east-1
    SERVICE_NAME: espectra-backend
    RESOURCE_PREFIX: ${self:custom.resourcePrefix}
    NODE_ENV: dev
    LOG_LEVEL: DEBUG
    API_VERSION: 'v1'

    # Cognito Variables
    COGNITO_USER_POOL_ID:
      Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
    COGNITO_CLIENT_ID:
      Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId

    # Message Queue URLs
    MESSAGE_QUEUE_URL:
      Fn::ImportValue: ${self:custom.resourcePrefix}-message-queue-url
    MESSAGE_DLQ_URL:
      Fn::ImportValue: ${self:custom.resourcePrefix}-message-dlq-url
    HANDOFF_QUEUE_URL:
      Fn::ImportValue: ${self:custom.resourcePrefix}-handoff-queue-url

    # DynamoDB Tables
    CONNECTION_TABLE:
      Fn::ImportValue: ${self:custom.resourcePrefix}-connections-table-name
    CHAT_HISTORY_TABLE:
      Fn::ImportValue: ${self:custom.resourcePrefix}-chat-history-table-name
    CONTEXT_TABLE:
      Fn::ImportValue: ${self:custom.resourcePrefix}-context-table-name
    TOKEN_TABLE:
      Fn::ImportValue: ${self:custom.resourcePrefix}-tokens-table-name
    REGISTRATION_REQUESTS_TABLE:
      Fn::ImportValue: ${self:custom.resourcePrefix}-registration-requests-table-name
    USERS_TABLE:
      Fn::ImportValue: ${self:custom.resourcePrefix}-users-table-name
    # HANDOFF_TABLE:
    #   Fn::ImportValue: ${self:custom.resourcePrefix}-handoff-table-name

    # Botpress Configuration
    BOTPRESS_API_URL: ${ssm:/espectra/dev/botpress-api-url, 'https://api.botpress.cloud/v1'}
    BOTPRESS_BOT_ID: ${ssm:/espectra/dev/botpress-bot-id, 'your-bot-id'}
    BOTPRESS_API_KEY: ${ssm:/espectra/dev/botpress-api-key, 'your-api-key'}
    BOTPRESS_WORKSPACE_ID: ${ssm:/espectra/dev/botpress-workspace-id, 'your-workspace-id'}
    BOTPRESS_EVENT_BUS:
      Fn::ImportValue: ${self:custom.resourcePrefix}-eventbus-name

    # WebSocket
    WEBSOCKET_API_ENDPOINT:
      Fn::ImportValue: ${self:custom.resourcePrefix}-websocket-endpoint

    # Redis Configuration
    REDIS_HOST:
      Fn::ImportValue: ${self:custom.resourcePrefix}-redis-endpoint
    REDIS_PORT:
      Fn::ImportValue: ${self:custom.resourcePrefix}-redis-port

    SESSION_TTL: ${self:custom.session.ttl}
    SESSION_EXTEND_DURATION: ${self:custom.session.extendDuration}
    METRICS_RETENTION_DAYS: ${self:custom.monitoring.metricsRetention}
    SESSION_ALERT_THRESHOLD: ${self:custom.monitoring.sessionAlertThreshold}
    RATE_LIMIT_SESSION_CREATION: ${self:custom.rateLimit.sessionCreation}

    COGNITO_CLIENT_SECRET: ${ssm:/espectra/dev/cognito/client-secret, 'your-client-secret'}

custom:
  projectName: espectra-backend
  stage: dev
  deploymentId: v4-r1
  resourcePrefix: espectra-backend-dev-v4-r1
  service: espectra-backend
  company: technoapes
  service_fase2: espectra-backend-phase2-v4r1
  service_fase3: espectra-backend-phase3-v4r1

  logRetentionInDays: 14

  logLevel:
    dev: 'DEBUG'
    staging: 'INFO'
    prod: 'WARN'

  # Configuración de Table Names
  tableNames:
    connections: espectra-backend-dev-v4-r1-connection-table
    context: espectra-backend-dev-v4-r1-conversation-context-table
    tokens: espectra-backend-dev-v4-r1-token-usage-table
    handoff: espectra-backend-dev-v4-r1-handoff-table
    metrics: espectra-backend-dev-v4-r1-botpress-metrics-table
    requestRegistration: espectra-backend-dev-v4-r1-registration-requests-table-name

  session:
    ttl: ${ssm:/espectra/dev/session/ttl, '3600'}
    extendDuration: ${ssm:/espectra/dev/session/extend-duration, '1800'}

  monitoring:
    metricsRetention: ${ssm:/espectra/dev/monitoring/metrics-retention, '30'}
    sessionAlertThreshold: ${ssm:/espectra/dev/monitoring/session-alert-threshold, '100'}

  rateLimit:
    sessionCreation: ${ssm:/espectra/dev/rate-limit/session-creation, '10'}

  # KMS Keys
  kms:
    systemKeyId: ${ssm:/espectra/dev/kms/system-key-id, 'espectra-backend-dev-v4-r1-kms.SystemKeyId'}
    systemKeyArn: ${ssm:/espectra/dev/kms/system-key-arn, 'espectra-backend-dev-v4-r1-kms.SystemKeyArn'}
    secretsKeyId: ${ssm:/espectra/dev/kms/secrets-key-id, 'espectra-backend-dev-v4-r1-kms.SecretsKeyId'}
    secretsKeyArn: ${ssm:/espectra/dev/kms/secrets-key-arn, 'espectra-backend-dev-v4-r1-kms.SecretsKeyArn'}
    websocketKeyId: ${ssm:/espectra/dev/kms/websocket-key-id, 'espectra-backend-dev-v4-r1-kms.WebsocketKeyId'}
    websocketKeyArn: ${ssm:/espectra/dev/kms/websocket-key-arn, 'espectra-backend-dev-v4-r1-kms.WebsocketKeyArn'}

  # SNS Topics
  snsHighPriorityTopic: ${ssm:/espectra/dev/sns/high-priority-topic, 'espectra-backend-dev-v4-r1-sns.HighPriorityTopicArn'}
  snsMediumPriorityTopic: ${ssm:/espectra/dev/sns/medium-priority-topic, 'espectra-backend-dev-v4-r1-sns.MediumPriorityTopicArn'}
  snsLowPriorityTopic: ${ssm:/espectra/dev/sns/low-priority-topic, 'espectra-backend-dev-v4-r1-sns.LowPriorityTopicArn'}

  # Handoff Configuration
  handoff:
    maxQueueSize: 100
    maxWaitTime: 300

  # Alarm Thresholds
  alarmThresholds:
    api:
      latency: 1000
      4xxErrors: 5
      5xxErrors: 1
    websocket:
      connections: 2000

  serverless-offline:
    httpPort: 3000
    websocketPort: 3001
    lambdaPort: 3002
    noPrependStageInUrl: true
    noTimeout: true

  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: true
      migrate: true
      seed: true

  # Configuración de mocks para servicios AWS
  localstack:
    stages:
      - dev
    endpointFile: config/localEndpoints.json

plugins:
  - serverless-iam-roles-per-function
  - serverless-prune-plugin
  - serverless-plugin-tracing
  - serverless-offline
  # - serverless-dynamodb-local
  # - serverless-webpack
  # - serverless-offline-sns
  # - serverless-offline-sqs

package:
  individually: false
  patterns:
    - 'src/**'
    # - "!node_modules/**"
    # - "!dist/**"
    # - "!**/*.spec.ts"
    # - "!**/*.test.ts"
    # - "!**/*.md"
    # - "!**/*.yml"
    # - "!**/*.yaml"
    # - "!**/.git/**"
    # - "!**/.serverless/**"

functions:
  # Auth Functions
  restAuthorizer:
    handler: services/auth/handlers/authorizer.handler
    name: ${self:custom.resourcePrefix}-rest-authorizer
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    memorySize: 256
    environment:
      COGNITO_USER_POOL_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
      COGNITO_CLIENT_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId

  register:
    handler: services/auth/handlers/register.handler
    name: ${self:custom.resourcePrefix}-register
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/register
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      ALLOWED_ORIGINS: '*'
      PASSWORD_MIN_LENGTH: '8'
      USER_POOL_REGION: us-east-1
      COGNITO_USER_POOL_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
      COGNITO_CLIENT_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId
      COGNITO_CLIENT_SECRET: ${ssm:/espectra/dev/cognito/client-secret}
      SES_FROM_EMAIL: 'soporte@spectrumai.com.co'
      AUTO_CONFIRM_USERS: 'false'

  contactRequest:
    handler: services/auth/handlers/contactRequest.handler
    name: ${self:custom.resourcePrefix}-contact-request
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/contact-request
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      GOOGLE_SHEETS_SPREADSHEET_ID: ${ssm:/espectra/${self:provider.stage}/google-sheets-spreadsheet-id}
      GOOGLE_SHEETS_PRIVATE_KEY: ${ssm:/espectra/${self:provider.stage}/google-sheets-private-key}
      GOOGLE_SHEETS_CLIENT_EMAIL: ${ssm:/espectra/${self:provider.stage}/google-sheets-client-email}
      GOOGLE_SHEETS_CONTACT_REQUESTS_SHEET: SpectraContactRequests

  login:
    handler: services/auth/handlers/login.handler
    name: ${self:custom.resourcePrefix}-login
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/login
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      COGNITO_USER_POOL_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
      COGNITO_CLIENT_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId

  refreshToken:
    handler: services/auth/handlers/refreshToken.handler
    name: ${self:custom.resourcePrefix}-refreshToken
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/refresh-token
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      COGNITO_USER_POOL_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
      COGNITO_CLIENT_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId
      COGNITO_CLIENT_SECRET: ${ssm:/espectra/${self:provider.stage}/cognito/client-secret}

  logout:
    handler: services/auth/handlers/logout.handler
    name: ${self:custom.resourcePrefix}-logout
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/logout
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
          authorizer:
            name: restAuthorizer

  me:
    handler: services/auth/handlers/me.handler
    name: ${self:custom.resourcePrefix}-me
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/me
          method: get
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
          authorizer:
            name: restAuthorizer

  forgotPassword:
    handler: services/auth/handlers/forgot-password.handler
    name: ${self:custom.resourcePrefix}-forgot-password
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/forgot-password
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      COGNITO_USER_POOL_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
      COGNITO_CLIENT_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId
      COGNITO_CLIENT_SECRET: ${ssm:/espectra/${self:provider.stage}/cognito/client-secret}
      SES_FROM_EMAIL: 'soporte@spectrumai.com.co'

  resetPassword:
    handler: services/auth/handlers/reset-password.handler
    name: ${self:custom.resourcePrefix}-reset-password
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/reset-password
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      COGNITO_USER_POOL_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
      COGNITO_CLIENT_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId
      COGNITO_CLIENT_SECRET: ${ssm:/espectra/${self:provider.stage}/cognito/client-secret}

  verifyEmail:
    handler: services/auth/handlers/verify-email.handler
    name: ${self:custom.resourcePrefix}-verify-email
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/verify-email
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      COGNITO_USER_POOL_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
      COGNITO_CLIENT_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId
      COGNITO_CLIENT_SECRET: ${ssm:/espectra/${self:provider.stage}/cognito/client-secret}
      SES_FROM_EMAIL: 'soporte@spectrumai.com.co'

  resendVerificationCode:
    handler: services/auth/handlers/resend-verification-code.handler
    name: ${self:custom.resourcePrefix}-resend-verification-code
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/resend-verification-code
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      COGNITO_USER_POOL_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
      COGNITO_CLIENT_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId
      COGNITO_CLIENT_SECRET: ${ssm:/espectra/${self:provider.stage}/cognito/client-secret}
      SES_FROM_EMAIL: 'soporte@spectrumai.com.co'

  testEmail:
    handler: services/auth/handlers/test-email.handler
    name: ${self:custom.resourcePrefix}-test-email
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: auth/test-email
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      SES_FROM_EMAIL: 'soporte@spectrumai.com.co'

  # WebSocket Functions
  wsAuthorizer:
    handler: services/websocket/handlers/authorizer.handler
    name: ${self:custom.resourcePrefix}-websocket-authorizer
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    memorySize: 256
    timeout: 29
    environment:
      COGNITO_USER_POOL_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolId
      COGNITO_CLIENT_ID:
        Fn::ImportValue: ${self:custom.resourcePrefix}-cognito-UserPoolClientId

  webSocketConnect:
    handler: services/websocket/handlers/connect.handler
    name: ${self:custom.resourcePrefix}-webSocketConnect
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - websocket:
          route: $connect
          authorizer:
            name: wsAuthorizer
            identitySource:
              - 'route.request.querystring.Auth'

  webSocketDisconnect:
    handler: services/websocket/handlers/disconnect.handler
    name: ${self:custom.resourcePrefix}-webSocketDisconnect
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - websocket:
          route: $disconnect

  webSocketMessage:
    handler: services/websocket/handlers/message.handler
    name: ${self:custom.resourcePrefix}-webSocketMessage
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - websocket:
          route: $default

  webSocketAgent:
    handler: services/websocket/handlers/agent.handler
    name: ${self:custom.resourcePrefix}-webSocketAgent
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - websocket:
          route: agent

  # Botpress Integration Functions
  botpressWebhook:
    handler: services/botpress/handlers/webhook/botpress-webhook.handler
    name: ${self:custom.resourcePrefix}-botpress-webhook
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: botpress/webhook
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
    environment:
      BOTPRESS_API_KEY: ${ssm:/espectra/${self:provider.stage}/botpress-api-key}
  # Removed aliases as it's not supported in Serverless v4

  processMessage:
    handler: services/botpress/handlers/message/process-message.handler
    name: ${self:custom.resourcePrefix}-process-message
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - sqs:
          arn:
            Fn::ImportValue: ${self:custom.resourcePrefix}-message-queue-arn
          batchSize: 1
          functionResponseType: ReportBatchItemFailures

  # Handoff Functions
  handoffRequest:
    handler: services/botpress/handlers/handoff/request.handler
    name: ${self:custom.resourcePrefix}-handoff-request
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: handoff/request
          method: post
          cors: true
          integration: lambda-proxy
          restApi:
            id: !Ref RestApiId
          authorizer:
            name: restAuthorizer
  # Removed aliases as it's not supported in Serverless v4

  handoffAccept:
    handler: services/botpress/handlers/handoff/accept.handler
    name: ${self:custom.resourcePrefix}-handoff-accept
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: handoff/accept
          method: post
          cors: true
          integration: lambda-proxy
          authorizer:
            name: restAuthorizer
  # Removed aliases as it's not supported in Serverless v4

  # Session Management Functions
  startSession:
    handler: services/session/handlers/start.handler
    name: ${self:custom.resourcePrefix}-start-session
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: session/start
          method: post
          cors: true
          integration: lambda-proxy
          authorizer:
            name: restAuthorizer

  createSession:
    handler: services/auth/handlers/session.createSession
    name: ${self:custom.resourcePrefix}-create-session
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: sessions/create
          method: post
          cors: true
          integration: lambda-proxy
          authorizer:
            name: restAuthorizer
    environment:
      SESSION_TABLE:
        Fn::ImportValue: ${self:custom.resourcePrefix}-chat-sessions-table-name
      METRICS_NAMESPACE: ${self:custom.service}/${self:provider.stage}

  extendSession:
    handler: services/auth/handlers/session.extendSession
    name: ${self:custom.resourcePrefix}-extend-session
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: sessions/update/{sessionId}
          method: put
          authorizer:
            name: restAuthorizer
    environment:
      SESSION_TABLE:
        Fn::ImportValue: ${self:custom.resourcePrefix}-chat-sessions-table-name

  endSession:
    handler: services/session/handlers/end.handler
    name: ${self:custom.resourcePrefix}-end-session
    role:
      Fn::ImportValue: ${self:custom.resourcePrefix}-lambda-role-arn
    events:
      - http:
          path: session/end
          method: post
          cors: true
          integration: lambda-proxy
          authorizer:
            name: restAuthorizer

resources:
  - ${file(infrastructure/apigateway/api.yml)}
  - ${file(infrastructure/apigateway/chat-api-routes.yml)}

  - ${file(infrastructure/security/waf.yml)}

  - ${file(infrastructure/websocket/websocket.yml)}
  - ${file(infrastructure/security/websocket-security.yml)}