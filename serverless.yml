service: espectra-backend
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 1024
  timeout: 29
  logRetentionInDays: 14
  tracing:
    lambda: true
    apiGateway: true
  logs:
    restApi:
      accessLogging: true
      executionLogging: true
      level: INFO
      fullExecutionData: true
  vpc:
    securityGroupIds:
      - !ImportValue ${self:custom.service}-${self:provider.stage}-lambda-sg-id
    subnetIds:
      - !ImportValue ${self:custom.service}-${self:provider.stage}-private-subnet-1-id
      - !ImportValue ${self:custom.service}-${self:provider.stage}-private-subnet-2-id
  websocket:
    apiId: !Ref WebSocketApi
    stage: ${self:provider.stage}
  httpApi:
    cors: true
  apiGateway:
    restApiId: !Ref RestApiId
    restApiRootResourceId: !GetAtt RestApiId.RootResourceId
    binaryMediaTypes:
      - '*/*'
  environment:
    # System Variables
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    SERVICE_NAME: ${self:custom.service}
    NODE_ENV: ${self:provider.stage}
    LOG_LEVEL: ${self:custom.logLevel.${self:provider.stage}}
    API_VERSION: "v1"
    METRICS_NAMESPACE: ${self:custom.service}/${self:provider.stage}
    XRAY_ENABLED: true
    
    # Cognito Variables
    COGNITO_USER_POOL_ID: !ImportValue ${self:custom.service}-${self:provider.stage}-user-pool-id
    COGNITO_CLIENT_ID: !ImportValue ${self:custom.service}-${self:provider.stage}-user-pool-client-id
    COGNITO_CLIENT_SECRET: ${ssm:/espectra/${self:provider.stage}/cognito/client-secret}

    # Message Queue URLs
    MESSAGE_QUEUE_URL: !ImportValue ${self:custom.service}-${self:provider.stage}-message-queue-url
    MESSAGE_DLQ_URL: !ImportValue ${self:custom.service}-${self:provider.stage}-message-dlq-url
    HANDOFF_QUEUE_URL: !ImportValue ${self:custom.service}-${self:provider.stage}-handoff-queue-url

    # DynamoDB Tables
    CONNECTION_TABLE: !ImportValue ${self:custom.service}-${self:provider.stage}-connections-table-name
    CHAT_HISTORY_TABLE: !ImportValue ${self:custom.service}-${self:provider.stage}-chat-history-table-name
    CONTEXT_TABLE: !ImportValue ${self:custom.service}-${self:provider.stage}-context-table-name
    TOKEN_TABLE: !ImportValue ${self:custom.service}-${self:provider.stage}-tokens-table-name
    REGISTRATION_REQUESTS_TABLE: !ImportValue ${self:custom.service}-${self:provider.stage}-registration-requests-table-name

    # Botpress Configuration
    BOTPRESS_API_URL: ${ssm:/espectra/${self:provider.stage}/botpress-api-url}
    BOTPRESS_BOT_ID: ${ssm:/espectra/${self:provider.stage}/botpress-bot-id}
    BOTPRESS_API_KEY: ${ssm:/espectra/${self:provider.stage}/botpress-api-key}
    BOTPRESS_WORKSPACE_ID: ${ssm:/espectra/${self:provider.stage}/botpress-workspace-id}
    BOTPRESS_EVENT_BUS: !ImportValue ${self:custom.service}-${self:provider.stage}-eventbus-name

    # WebSocket
    WEBSOCKET_API_ENDPOINT: ${self:custom.service}-${self:provider.stage}-websocket-endpoint

    # Redis Configuration
    REDIS_HOST: !ImportValue ${self:custom.service}-${self:provider.stage}-redis-endpoint
    REDIS_PORT: !ImportValue ${self:custom.service}-${self:provider.stage}-redis-port

    # Session Configuration
    SESSION_TTL: ${self:custom.session.ttl}
    SESSION_EXTEND_DURATION: ${self:custom.session.extendDuration}
    SESSION_ALERT_THRESHOLD: ${self:custom.monitoring.sessionAlertThreshold}
    
    # Google Sheets Integration (for contact requests)
    GOOGLE_SHEETS_SPREADSHEET_ID: ${ssm:/espectra/${self:provider.stage}/google-sheets-spreadsheet-id}
    GOOGLE_SHEETS_PRIVATE_KEY: ${ssm:/espectra/${self:provider.stage}/google-sheets-private-key}
    GOOGLE_SHEETS_CLIENT_EMAIL: ${ssm:/espectra/${self:provider.stage}/google-sheets-client-email}
    GOOGLE_SHEETS_CONTACT_REQUESTS_SHEET: SpectraContactRequests
    
    # Rate Limiting
    METRICS_RETENTION_DAYS: ${self:custom.monitoring.metricsRetention}
    RATE_LIMIT_SESSION_CREATION: ${self:custom.rateLimit.sessionCreation}

custom:
  service: espectra-backend
  
  # Logging configuration
  logRetentionInDays: 14
  logLevel:
    dev: 'DEBUG'
    staging: 'INFO'
    prod: 'WARN'
  
  # Infrastructure configuration
  floor: 1
  
  # Resource naming conventions
  tableNames:
    connections: ${self:custom.service}-${self:provider.stage}-connection-table
    context: ${self:custom.service}-${self:provider.stage}-conversation-context-table
    tokens: ${self:custom.service}-${self:provider.stage}-token-usage-table
    history: ${self:custom.service}-${self:provider.stage}-chat-history-table
    handoff: ${self:custom.service}-${self:provider.stage}-handoff-table
    metrics: ${self:custom.service}-${self:provider.stage}-botpress-metrics-table
    requestRegistration: ${self:custom.service}-${self:provider.stage}-registration-requests-table-name
  
  # KMS Keys references (imported from previous deployments)
  kms:
    systemKeyId: ${cf:${self:custom.service}-kms-${self:provider.stage}.SystemKMSKeyId}
    systemKeyArn: ${cf:${self:custom.service}-kms-${self:provider.stage}.SystemKMSKeyArn}
    secretsKeyId: ${cf:${self:custom.service}-kms-${self:provider.stage}.SecretsKMSKeyId}
    secretsKeyArn: ${cf:${self:custom.service}-kms-${self:provider.stage}.SecretsKMSKeyArn}
    websocketKeyId: ${cf:${self:custom.service}-kms-${self:provider.stage}.WebSocketKMSKeyId}
    websocketKeyArn: ${cf:${self:custom.service}-kms-${self:provider.stage}.WebSocketKMSKeyArn}
  
  # SNS Topics for notifications
  snsHighPriorityTopic: ${ssm:/espectra/${self:provider.stage}/sns/high-priority-topic}
  snsMediumPriorityTopic: ${ssm:/espectra/${self:provider.stage}/sns/medium-priority-topic}
  snsLowPriorityTopic: ${ssm:/espectra/${self:provider.stage}/sns/low-priority-topic}
    
  # Handoff configuration
  handoff:
    maxQueueSize: 100
    maxWaitTime: 300
  
  # Session configuration
  session:
    ttl: ${ssm:/espectra/${self:provider.stage}/session/ttl}
    extendDuration: ${ssm:/espectra/${self:provider.stage}/session/extend-duration}
  
  # Monitoring configuration
  monitoring:
    metricsRetention: ${ssm:/espectra/${self:provider.stage}/monitoring/metrics-retention}
    sessionAlertThreshold: ${ssm:/espectra/${self:provider.stage}/monitoring/session-alert-threshold}
  
  # Rate limiting configuration
  rateLimit:
    sessionCreation: ${ssm:/espectra/${self:provider.stage}/rate-limit/session-creation}
  
  # Redis configuration
  redis:
    instanceType: 'cache.t3.micro'
  
  # Alarm thresholds
  alarmThresholds:
    lambda:
      errors: 5
      throttles: 5
      duration: 10000
      period: 300
    api:
      latency: 1000
      4xxErrors: 5
      5xxErrors: 1
      period: 300
    dynamodb:
      throttles: 10
      period: 300
    websocket:
      connections: 2000
      period: 300
    costs:
      monthly: 1000
  
  # Botpress-specific alarm thresholds
  botpressAlarmThresholds:
    errorRate: 5
    latency: 1000
    period: 300
    handoffQueueSize: 50
    handoffLatency: 2000
    tokenUsage: 80
    handoffSuccessRate: 90
  
  # WebSocket API configuration
  apiGatewayWebsocket:
    minimumCompressionSize: 1024
    websocketApiId: !Ref WebSocketApi
    stage: ${self:provider.stage}
  
  # Local development configurations
  serverless-offline:
    httpPort: 3000
    websocketPort: 3001
    lambdaPort: 3002
    noPrependStageInUrl: true
  
  dynamodb:
    stages:
      - dev
    start:
      port: 8000
      inMemory: true
      migrate: true
      seed: true
  
  localstack:
    stages:
      - dev
    endpointFile: config/localEndpoints.json
  
  # Deployment order - plugin configuration
  deploymentBuckets:
    versioning: true
    blockPublicAccess: true
    serverSideEncryption: AES256
  
  dependsOn:
    enabled: true
    chains:
      - kms
      - sns
      - cognito
      - phase1
      - phase2
      - phase3
      - phase4
      - phase5

plugins:
  - serverless-iam-roles-per-function
  - serverless-prune-plugin
  - serverless-plugin-tracing
  - serverless-plugin-order
  - serverless-plugin-common-excludes
  - serverless-plugin-include-dependencies
  # Development plugins (commented for production)
  # - serverless-offline
  # - serverless-dynamodb-local
  # - serverless-webpack
  # - serverless-offline-sns
  # - serverless-offline-sqs

package:
  individually: true
  patterns:
    - 'src/**'
    - 'services/**/*.ts'
    - 'shared/**/*.ts'
    - '!**/*.spec.ts'
    - '!**/*.test.ts'
    - '!**/*.md'
    - '!**/.git/**'
    - '!**/.serverless/**'
  excludeDevDependencies: true

functions:
  # --- Auth Functions ---
  - ${file(infrastructure/functions/auth.yml)}
  # --- WebSocket Functions ---
  - ${file(infrastructure/functions/websocket.yml)}
  # --- Botpress Functions ---
  - ${file(infrastructure/functions/botpress.yml)}
  # --- Session Functions ---
  - ${file(infrastructure/functions/session.yml)}
  # --- Metrics Functions ---
  - ${file(infrastructure/functions/metrics.yml)}

resources:
  # --- Security Resources ---
  - ${file(infrastructure/security/kms.yml)}
  - ${file(infrastructure/security/waf.yml)}
  - ${file(infrastructure/security/websocket-security.yml)}
  
  # --- Network Resources ---
  - ${file(infrastructure/network/vpc.yml)}
  - ${file(infrastructure/network/security-groups.yml)}
  
  # --- Storage Resources ---
  - ${file(infrastructure/dynamodb/user-tables.yml)}
  - ${file(infrastructure/dynamodb/chat-history-tables.yml)}
  - ${file(infrastructure/dynamodb/chat-session-tables.yml)}
  - ${file(infrastructure/dynamodb/connection-concierge-tables.yml)}
  - ${file(infrastructure/dynamodb/botpress-tables.yml)}
  - ${file(infrastructure/dynamodb/registration-request-tables.yml)}
  
  # --- Messaging Resources ---
  - ${file(infrastructure/queues/message-queues.yml)}
  - ${file(infrastructure/sns/sns.yml)}
  - ${file(infrastructure/eventbridge/botpress-event-bus.yml)}
  
  # --- API Resources ---
  - ${file(infrastructure/apigateway/api.yml)}
  - ${file(infrastructure/apigateway/chat-api-routes.yml)}
  - ${file(infrastructure/websocket/websocket.yml)}
  
  # --- Authentication Resources ---
  - ${file(infrastructure/cognito/cognito.yml)}
  
  # --- Cache Resources ---
  - ${file(infrastructure/elasticache/redis.yml)}
  
  # --- IAM Resources ---
  - ${file(infrastructure/iam/roles.yml)}
  - ${file(infrastructure/iam/websocket-roles.yml)}
  
  # --- Monitoring Resources ---
  - ${file(infrastructure/monitoring/cloudwatch.yml)}
  - ${file(infrastructure/monitoring/cloudwatch-alarms.yml)}
  - ${file(infrastructure/monitoring/botpress-cloudwatch-alarms.yml)}
  - ${file(infrastructure/monitoring/botpress-cloudwatch-dashboard.yml)}
  
  # --- Backup Resources ---
  - ${file(infrastructure/backup/backup.yml)}

outputs:
  # --- KMS Outputs ---
  SystemKMSKeyId:
    Description: ID of the system KMS key
    Value: !Ref SystemKMSKey
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-system-kms-key-id

  SystemKMSKeyArn:
    Description: ARN of the system KMS key
    Value: !GetAtt SystemKMSKey.Arn
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-system-kms-key-arn

  SecretsKMSKeyId:
    Description: ID of the secrets KMS key
    Value: !Ref SecretsKMSKey
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-secrets-kms-key-id

  SecretsKMSKeyArn:
    Description: ARN of the secrets KMS key
    Value: !GetAtt SecretsKMSKey.Arn
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-secrets-kms-key-arn

  WebSocketKMSKeyId:
    Description: ID of the WebSocket KMS key
    Value: !Ref WebSocketKMSKey
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-websocket-kms-key-id

  WebSocketKMSKeyArn:
    Description: ARN of the WebSocket KMS key
    Value: !GetAtt WebSocketKMSKey.Arn
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-websocket-kms-key-arn

  # --- SNS Outputs ---
  HighPriorityTopicArn:
    Description: ARN of the high priority SNS topic
    Value: !Ref HighPriorityTopic
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-high-priority-topic-arn

  MediumPriorityTopicArn:
    Description: ARN of the medium priority SNS topic
    Value: !Ref MediumPriorityTopic
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-medium-priority-topic-arn

  LowPriorityTopicArn:
    Description: ARN of the low priority SNS topic
    Value: !Ref LowPriorityTopic
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-low-priority-topic-arn

  # --- Cognito Outputs ---
  UserPoolId:
    Value: !Ref SpectraUserPool
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-user-pool-id

  UserPoolClientId:
    Value: !Ref SpectraUserPoolClient
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-user-pool-client-id

  UserPoolArn:
    Value: !GetAtt SpectraUserPool.Arn
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-user-pool-arn

  # --- VPC Outputs ---
  VpcId:
    Description: VPC ID
    Value: !Ref SpectraVPC
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-vpc-id

  VpcCidr:
    Description: VPC CIDR Block
    Value: !GetAtt SpectraVPC.CidrBlock
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-vpc-cidr

  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-public-subnet-1-id

  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-public-subnet-2-id

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-private-subnet-1-id

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-private-subnet-2-id

  # --- Security Group Outputs ---
  LambdaSecurityGroupId:
    Description: ID of the Lambda Security Group
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: ${self:custom.service}-${self:provider.stage}-lambda-sg-id

  RedisSecurityGroupId:
    Description: ID of the Redis Security Group
    Value: !Ref RedisSecurityGroup