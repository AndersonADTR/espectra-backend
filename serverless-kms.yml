# serverless-kms.yml
# Descripción: Define las claves KMS para encriptación en el sistema
# Dependencias: Ninguna (este es el primer stack que debe desplegarse)
# Orden de despliegue: 1

service: espectra-backend-kms-v4r1

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  tags:
    Project: espectra-backend
    Environment: dev
    Component: KMS
    Purpose: Encryption
    ManagedBy: serverless
    Company: technoapes

custom:
  projectName: espectra-backend
  stage: dev
  deploymentId: v4-r1
  resourcePrefix: espectra-backend-dev-v4-r1
  company: technoapes

resources:
  - ${file(infrastructure/security/kms.yml)}

