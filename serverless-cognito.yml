# serverless-cognito.yml
# Descripción: Define los recursos de autenticación con Amazon Cognito
# Dependencias: serverless-kms.yml, serverless-sns.yml (para alarmas)
# Orden de despliegue: 3

service: espectra-backend-cognito-v4r1

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1
  tags:
    Project: espectra-backend
    Environment: dev
    Component: Cognito
    Purpose: Authentication
    ManagedBy: serverless
    Company: technoapes

custom:
  projectName: espectra-backend
  stage: dev
  deploymentId: v4-r1
  resourcePrefix: espectra-backend-dev-v4-r1
  # Configuraciones específicas para Cognito
  cognito:
    userPool:
      emailSender: "soporte@spectrumai.com.co"
      mfaConfiguration: OPTIONAL
      passwordPolicy:
        minLength: 8
        requireLowercase: true
        requireUppercase: true
        requireNumbers: true
        requireSymbols: true
        temporaryPasswordValidityDays: 7
    userPoolClient:
      accessTokenValidity: 1
      idTokenValidity: 1
      refreshTokenValidity: 30
      authSessionValidity: 3
    alarms:
      signInErrorsThreshold: 10
      signInErrorsEvaluationPeriods: 2
      compromisedCredentialsThreshold: 1
      period: 300

resources:
  - ${file(infrastructure/cognito/cognito.yml)}

